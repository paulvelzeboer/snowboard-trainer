<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Ready — Snowboard Trainer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="pistes.js"></script>
<style>
:root{--bg:#e8f1f8;--card:#fff;--ink:#0e2238;--mute:#5a6c80;--line:#d5e2ee;--blue:#0a6fd6;--red:#e2283f;--ok:#12975a;--heel:#f07f09;--soft:#e6f0f9;
--sky1:#0e4a86;--sky2:#5fb4ea;--sky3:#cfeafb;--m1:#a9c9e4;--m2:#5d8fbd;--m3:#27527f;--cap:#fff;--sun:#ffd76a}
@media(prefers-color-scheme:dark){:root{--bg:#0a121c;--card:#132030;--ink:#e8f0f8;--mute:#8fa3b8;--line:#22364b;--blue:#56a8ff;--red:#ff5d70;--ok:#3fd08f;--heel:#ffad42;--soft:#1a2c40;
--sky1:#050a14;--sky2:#0f2440;--sky3:#1d3c5f;--m1:#27405c;--m2:#1a2f47;--m3:#101f31;--cap:#c9d9e8;--sun:#e8eef6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:relative}
.hero{position:absolute;inset:0 0 auto;height:310px;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--sky3));overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%;margin:0}
header,nav,main{position:relative}
header{padding:22px 16px 0;max-width:860px;margin:auto;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;color:#fff;text-shadow:0 1px 8px rgba(5,20,40,.5)}
header small{color:#fff;opacity:.92}
h1{margin:0 0 4px;font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.02em;text-transform:uppercase;line-height:1.25}
h1 span{display:inline-block;background:var(--red);color:#fff;padding:0 9px;border-radius:6px;transform:skewX(-8deg);text-shadow:none}
h2{font-size:18px;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}h3{font-size:15px;margin:14px 0 4px}
p{margin:6px 0}small,.mute{color:var(--mute)}
nav{display:flex;gap:6px;max-width:860px;margin:14px auto 0;padding:0 16px;overflow-x:auto}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap}
button:hover{border-color:var(--blue)}
header button,nav button{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:none}
header button:hover,nav button:hover{border-color:#fff;background:rgba(255,255,255,.32)}
nav button.on{background:#fff;border-color:#fff;color:#0e2238}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
main{max-width:860px;margin:auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(14,34,56,.09)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:linear-gradient(140deg,var(--m3),var(--blue));color:#fff;border-radius:12px;padding:10px;text-align:center;font-size:14px}
.stat b{display:block;font-size:24px;font-weight:900;font-style:italic}
.coach{border-left:5px solid var(--red)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{padding:6px 2px;font-size:12px;line-height:1.3;white-space:normal;border-radius:10px}
.strip .sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.strip .done{background:var(--ok);border-color:var(--ok);color:#fff}
.strip .today b{text-decoration:underline}
.ex{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ex input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
.ex .dose{color:var(--blue);font-weight:700;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft)}
.p0{color:var(--blue)}.p1{color:var(--heel)}.p2{color:var(--red)}.p3{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}
tr.now{background:var(--soft)}tr[data-open]{cursor:pointer}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.s1{border-color:var(--heel);color:var(--heel)}.s2{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red))}
svg{width:100%;height:auto;display:block;margin:8px 0}
.skill{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:16px;align-items:start}
.skill svg{margin:0;border-radius:12px;font-size:11px;font-weight:600;border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.skill svg{filter:brightness(.88)}}
input[type=date],.form input,.form select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.skill{grid-template-columns:1fr}h1{font-size:20px}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}.form input,.form select{width:100%}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px}.notes h3{margin-top:6px}
#map{height:540px;border-radius:12px;border:1px solid var(--line);margin:10px 0;z-index:0}
.base{background:var(--red);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px}
.plabel{background:rgba(255,255,255,.88);border:0;box-shadow:none;padding:0 4px;font-size:11px;font-weight:700;color:#12212f}.plabel:before{display:none}
#map:not(.zoomed) .plabel:not(.rec){display:none}
.piste{display:block;width:100%;text-align:left;border-radius:10px;margin-top:6px;white-space:normal}.piste .dot{margin-left:0}
</style>
</head>
<body>
<div class="hero"><svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<circle cx="960" cy="70" r="34" fill="var(--sun)" opacity=".9"/>
<path d="M0 300V190L90 140L170 175L280 95L380 165L470 120L560 170L680 80L790 160L880 125L980 175L1090 105L1200 165V300Z" fill="var(--m1)"/>
<path d="M280 95L252 115L267 111L279 121L291 110L305 112ZM680 80L650 102L666 98L679 109L692 97L707 100ZM1090 105L1062 122L1077 118L1089 128L1101 117L1117 120Z" fill="var(--cap)" opacity=".85"/>
<path d="M0 300V230L120 150L210 205L330 125L450 215L560 150L660 210L800 110L930 215L1040 160L1130 205L1200 170V300Z" fill="var(--m2)"/>
<path d="M120 150L90 170L105 166L118 175L130 165L142 164ZM330 125L300 145L315 141L328 152L342 142L360 148ZM560 150L532 166L547 163L559 172L571 162L585 165ZM800 110L765 135L782 131L798 143L814 132L832 136ZM1040 160L1012 174L1027 171L1039 180L1050 170L1062 171Z" fill="var(--cap)"/>
<path d="M0 300V255L150 225L300 250L480 215L640 255L820 225L1000 255L1200 220V300Z" fill="var(--m3)"/>
<path d="M0 300V270C200 240 400 290 600 268S1000 240 1200 272V300Z" fill="var(--bg)"/>
<g><rect x="-9" y="-5" width="18" height="4" rx="2" fill="var(--red)"/><circle cy="-10" r="4" fill="var(--m3)"/><animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M-20 272C200 240 400 290 600 268S1000 240 1220 274"/></g>
<g id="flakes" fill="#fff"></g>
</svg></div>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><pattern id="cord" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M2.5 0V5" stroke="#cfe0ee" stroke-width="1"/></pattern></defs></svg>
<header id="head"></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
// ---------- state & dates ----------
const KEY='redready.v2';
const RAW=JSON.parse(localStorage.getItem(KEY)||'{}');
// Each profile holds a rider's stats plus their own plan and progress. Older saves (one unnamed rider) become the Paul profile.
const S={lang:RAW.lang||'en',active:RAW.active,profiles:RAW.profiles||{paul:{name:'Paul',cm:197,kg:100,stance:'goofy',resort:'Les Sybelles',preset:1,start:RAW.start||null,trip:RAW.trip||'2027-01-30',chk:RAW.chk||{},done:RAW.done||{},fb:RAW.fb||{},skill:RAW.skill||{}}}};
let P;
const REG=()=>P.stance==='regular';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function use(id){S.active=id in S.profiles?id:Object.keys(S.profiles)[0];P=S.profiles[S.active];if(!P.start)P.start=monday(TODAY)}
// Personalises text for the active profile: {f}/{b} = front/back foot side, {cm} {kg} {w1} {w2} = stats,
// {h}…{/h} = heavier riders only, {p}…{/p} = only for the preset profile's own gear and resort.
function fill(h){const r=REG(),f=r?'left':'right',b=r?'right':'left',cap=s=>s[0].toUpperCase()+s.slice(1),
 map={f:T.side[f],b:T.side[b],F:cap(T.side[f]),B:cap(T.side[b]),Fs:T.sideShort[f],Bs:T.sideShort[b],s:P.stance,S:cap(P.stance),cm:P.cm,kg:P.kg,w1:Math.round(P.cm*.295),w2:Math.round(P.cm*.315),resort:esc(P.resort),tb:T.tb[r?1:0],bind:P.preset?T.bindP:T.bindG};
 return h.replace(/\{h\}([\s\S]*?)\{\/h\}/g,P.kg>=90?'$1':'').replace(/\{p\}([\s\S]*?)\{\/p\}/g,P.preset?'$1':'').replace(/<li><\/li>/g,'').replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m)}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const day=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=day(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((day(a)-day(b))/864e5);
const dow=s=>(day(s).getDay()+6)%7;
const monday=s=>add(s,-dow(s));
const fmt=s=>day(s).toLocaleDateString(T.loc,{day:'numeric',month:'short'});
const TODAY=iso(new Date());
use(S.active);save();
let tab='today',sel=TODAY;

// ---------- plan model (language-independent) ----------
const TEMPLATE=['A','Z','C','B','M','I','R']; // Mon..Sun
const nWeeks=()=>Math.max(1,Math.ceil(diff(P.trip,P.start)/7));
const weekOf=d=>Math.floor(diff(d,P.start)/7);
function phase(w){const n=nWeeks();if(w>=n-1)return 3;if(w>=n-4)return 2;return w<Math.ceil((n-4)/2)?0:1}
const typeOf=d=>(d<P.start||d>=P.trip)?null:TEMPLATE[dow(d)];
// trainer auto-adjust: each "too easy / too hard" shifts that session type by ~10%
function lvl(t){let l=0;for(const d of Object.keys(P.fb).sort())if(typeOf(d)===t)l=Math.max(-1,Math.min(2,l+P.fb[d]));return l}
// [sets, amount, unit] per exercise; arrays are per phase [Foundation, Build, Peak, Taper]. Texts live in C[lang].ses, same order.
const W=[1,null,''],s3=[3,3,3,2];
const DOSE={
A:[W,[[3,4,3,2],[12,8,12,10],'reps'],[s3,[8,10,12,8],'reps/side'],[s3,[30,45,70,30],'s'],[s3,[15,10,14,12],'reps'],[s3,[30,45,60,30],'s'],[s3,[8,10,12,8],'reps/side']],
B:[W,[[3,3,4,2],[12,10,10,12],'reps'],[[3,4,4,2],[10,8,10,8],'reps'],[s3,[8,10,10,6],'reps/side'],[s3,[20,30,40,20],'s/side'],[s3,[10,12,12,8],'reps/side'],[s3,[8,10,10,8],'reps/side'],[s3,[8,10,12,6],'reps']],
C:[W,[s3,[30,30,40,30],'s/side'],[s3,[6,8,10,6],'reps/side'],[s3,[40,60,75,40],'s'],[s3,[10,14,25,10],['reps/side','reps/side','s','reps/side']],[s3,[16,24,8,12],'reps/side'],[[0,3,3,0],[0,5,6,0],'reps'],[1,8,'min']],
Z:[[1,[30,40,45,25],'min']],
I:[[1,[5,8,8,5],'min'],[[1,6,8,1],[40,2,1,20],'min'],[[0,0,4,0],[0,0,45,0],'s'],[1,5,'min']],
M:[[2,45,'s/side'],[2,45,'s/side'],[2,8,'reps/side'],[3,30,'s'],[2,8,'reps/side'],[1,20,'min']],
R:[]};
const BOARDS=[{name:'Nitro Cinema Wide 162',len:162,w:59,f:15,b:-9},{name:'Nitro Magnum Ti Wide 171',len:171,w:61,f:18,b:-6,sb:1},{name:'Salomon Sight 166 Wide',len:166,w:60,f:15,b:-9}];
const SKILL_IDS=['posture','edges','steer','shape','flex','early','short','carve','flats','bumps','steep'];

// ---------- content ----------
const C={
en:{loc:'en-GB',other:'Nederlands',
 title:'Red <span>Ready</span> — your snowboard trainer',
 tabs:{today:'Today',plan:'Plan',stance:'Stance & gear',tech:'Technique',trip:'Trip',profile:'Profile'},
 days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
 phases:['Foundation','Build','Peak','Taper'],
 phaseWhy:['Learn the movements, build the habit. Leave 2–3 reps in the tank.','More load and longer holds. This is where the legs get strong.','Snowboard-specific: leg endurance, lateral power, long efforts — like a day on the mountain.','Stay loose, arrive fresh. Do less than you want to.'],
 u:{'reps':'reps','reps/side':'reps/side','s':'s','s/side':'s/side','min':'min'},
 stats:['days to go','week','sessions done','red-ready'],
 coach:'Coach',
 tripDay:(n,t)=>`<b>Trip day ${n}: ${t[0]}.</b> Board: ${t[1]}. ${t[2]}<br><small>10-minute warm-up before the first lift, first run easy, water in your pocket.</small>`,
 back:'<b>Welcome back.</b> Update what you nailed under Technique — and set a new trip date under Plan to start the next block.',
 count:(left,w,n,ph,why)=>`<b>${left} days to {resort}.</b> Week ${w} of ${n}, ${ph} phase. ${why}`,
 todayDone:'Today is done. Good work — eat, sleep, repeat.',
 skipped:(title,d)=>`You skipped <b>${title}</b> on ${d}. Today is light — make it up now.`,open:'Open it',
 rated:(title,easy)=>`You rated ${title} “too ${easy?'easy':'hard'}” — I've ${easy?'raised':'eased'} that session type by about 10%.`,
 none:(d,a,b)=>`No training planned for ${d} — the plan runs from ${a} until the trip on ${b}.`,
 adjust:'trainer adjust',complete:'✓ Session complete.',how:'How was it?',fbs:['Too easy','Just right','Too hard'],undo:'Undo',finish:'Finish session',
 block:'Your block',tripStart:'Trip start:',rescale:'The phases rescale automatically.',
 planNote:'Six sessions a week, 20–50 minutes each. Missing one is fine — never try to "catch up" two hard sessions in one day. If you have joint or heart issues, clear the plan with your doctor first.',
 rhythm:'Weekly rhythm',phasesH:'Phases',rulesH:'Training rules',
 rules:['Progress when the last rep still looks like the first. Tell the coach "too easy" and it adds load for you.','Muscle soreness is fine; sharp joint pain is a stop sign.','{h}Losing even 3–4 kg before the trip makes every turn, every fall and every get-up easier — the cardio days and ≈150 g protein a day take care of most of it.{/h}','Book 2–3 evenings at an indoor snow hall in January. Nothing off-snow replaces snow time; take the Technique drills with you.'],
 allWeeks:'All weeks',weekTh:['#','Dates','Phase','Done'],
 ses:{
 A:{short:'Legs',title:'Strength A — legs & core',why:'Riding is a long isometric squat. Strong quads and a stiff trunk are what keep your turns clean at 3 pm.',ex:[
  ['Warm-up','5 min easy movement, then 10 leg swings each way, 10 hip circles, 10 slow bodyweight squats.'],
  [['Bodyweight squat','Goblet squat (dumbbell/backpack)','Tempo goblet squat — 3 s down','Bodyweight squat'],'Feet at snowboard-stance width, knees track over toes, chest up.'],
  [['Reverse lunge','Reverse lunge (weighted)','Walking lunge','Reverse lunge'],'Step back softly, front knee stays over the foot.'],
  ['Wall sit','Thighs parallel, back flat. This is your heelside-traverse muscle.'],
  [['Calf raise','Single-leg calf raise','Single-leg calf raise','Calf raise'],'Slow up, slower down. Toeside turns live in your calves.'],
  ['Plank','Straight line ear–hip–heel, squeeze glutes, breathe.'],
  ['Dead bug','Lower back glued to the floor the whole time.']]},
 B:{short:'Hips',title:'Strength B — hips, back & rotation',why:'Hamstrings and glutes protect your knees; rotational core lets you steer with the lower body while the upper body stays quiet.',ex:[
  ['Warm-up','5 min easy movement, then 10 leg swings each way, 10 hip circles, 10 slow bodyweight squats.'],
  [['Glute bridge','Single-leg glute bridge','Hip thrust (shoulders on sofa, weighted)','Glute bridge'],'Drive through heels, pause 1 s at the top.'],
  ['Romanian deadlift (dumbbells or loaded backpack)','Hips back, soft knees, flat back. Feel the hamstrings load.'],
  [['Lateral lunge','Lateral lunge','Cossack squat','Lateral lunge'],'Sit into one hip, other leg straight. Opens the hips for a wide stance.'],
  ['Side plank','Hips high and forward. Knees down if needed.'],
  [['Russian twist','Russian twist (weighted)','Woodchop (band or dumbbell)','Russian twist'],'Rotate from the ribs, hips stay still.'],
  ['Bird dog',"Slow. Don't let the hips rock."],
  ['Push-up','You will push yourself up off the snow dozens of times a day. Incline (hands on a bench) if needed.']]},
 C:{short:'Balance',title:'Core & balance',why:'Balance is a skill, not a strength. Ten minutes of it transfers to the board faster than anything else you can do off-snow.',ex:[
  ['Warm-up','5 min easy movement, then 10 leg swings each way, 10 hip circles, 10 slow bodyweight squats.'],
  [['Single-leg balance','Single-leg balance, eyes closed','Single-leg balance on a cushion','Single-leg balance'],'Soft knee, quiet hips.'],
  ['Single-leg Romanian deadlift (bodyweight)','Reach long, hinge slow. Touch a wall if you wobble.'],
  ['Stance toe–heel rocks','Snowboard stance, half squat. Rock slowly from balls of feet to heels without straightening — rehearsing edge changes.'],
  [['Plank shoulder taps','Plank shoulder taps','Hollow hold','Plank shoulder taps'],'No hip sway.'],
  [['Mountain climbers','Mountain climbers','Skater bounds (side to side, stick the landing)','Mountain climbers'],'{h}At {kg} kg, land soft and low. {/h}If knees complain, swap for step-ups.'],
  [['—','Squat jump & stick','Squat jump & stick','—'],'Small jump, land silent in riding stance, hold 2 s.'],
  ['Mobility finisher','Hip-flexor stretch, 90/90 hips, ankle-to-wall dorsiflexion, thoracic rotations. 1 min each per side.']]},
 Z:{short:'Cardio',title:'Stamina — steady Zone 2',why:'Aerobic base = more runs per day and faster recovery on the lift. Altitude{p} at Les Sybelles (up to ~2600 m){/p} taxes it further.',ex:[
  ['Steady cardio: bike, rower, incline walk or swim','Talk-test pace: you can speak full sentences.{h} Low-impact is kinder on the joints at your weight than running.{/h}']]},
 I:{short:'Engine',title:'Stamina — long / intervals',why:'A snowboard run is 2–5 minutes of hard leg work, then a lift. Train that pattern.',ex:[
  ['Easy warm-up','Gradually raise the heart rate.'],
  [['Brisk hike, walk or easy ride','Intervals: 2 min hard / 2 min easy','Intervals: 1 min very hard / 1 min easy','Easy spin or walk'],'Hard = you can only say a few words. Bike or rower preferred.'],
  [['—','—','Leg-burn finisher: squat hold in riding stance','—'],'30 s rest between. Stay low, keep breathing — this is the last run of the day.'],
  ['Cool-down & stretch','Quads, hamstrings, calves, hips.']]},
 M:{short:'Mobility',title:'Mobility & recovery',why:'Ankle and hip range lets you get low on the board. 15 minutes, no sweat.',ex:[
  ['Ankle-to-wall stretch','Knee travels over toes, heel stays down.'],
  ['Couch / hip-flexor stretch','Tuck the pelvis, squeeze the glute.'],
  ['90/90 hip switches','Sit tall, rotate slowly.'],
  ['Deep squat hold','Hold onto a door frame; pry knees out.'],
  ['Thoracic rotation (open book)','Follow the hand with your eyes.'],
  ['Easy walk','Optional but worth it.']]},
 R:{short:'Rest',title:'Rest day',why:'Adaptation happens today. Sleep, eat protein (aim ≈ 150 g/day), drink water. A relaxed walk is fine.',ex:[]}},
 svg:{back:'{Bs} (back)',front:'{Fs} (front)',nose:'NOSE →',tail:'tail · toe edge {tb} (white dot = toes)'},
 boards:[
 {role:'Your main board: a directional twin with Nitro\'s Gullwing profile — rocker between the feet, camber under each binding. That makes it loose, easy to pivot and hard to catch an edge on, which is exactly right for drills and first reds. The trade-off is less edge grip at speed and on hard snow, and at {kg} kg you are at the top of what a 162 likes, so it will chatter when you push it.',
  rows:[['Shape & profile','Directional twin · Gullwing (rocker in the centre, camber under the bindings) · radial sidecut · all-terrain flex · extruded base'],['Ride it like this','The rocker feels loose on flat cat tracks: always keep a hint of edge. For carving, tilt it further than feels natural. The extruded base is slower on flats, so get a fresh hot wax before the trip.'],['Stance width','58–60 cm — start on the reference inserts, go one hole wider if your knees feel pinched'],['Angles ({s})','{F} foot (front) +15°, {b} foot (back) −9°'],['Alternative','+18° / −6° if your back knee feels twisted'],['Position','Reference stance, centred heel-to-toe'],['Use it for','Days 1–4 of the trip, all drills, your first reds']]},
 {role:'The big-guy charger. Long, stiff and damp — rock-solid at speed and built for your size, but it needs speed and commitment to bend, and it punishes back-seat riding. Bring it out once your turns are confident.',
  rows:[['Stance width','60–62 cm on the reference inserts'],['Angles ({s})','{F} foot (front) +18°, {b} foot (back) −6°'],['Alternative','+21° / 0° for a carving-focused groomer day'],['Position','Keep the reference setback — it is a directional board, do not centre it'],['Use it for','Days 5–6: carving wide blues and fast groomed reds']]},
 {role:'Your third option. An all-rounder with camber between the feet, so it grips noticeably better than the Cinema on hard snow, while the soft-to-medium flex keeps it forgiving. At 166 cm with a 275 mm waist it is on paper the best match of your three boards for {kg} kg and EU 47 boots, which makes it a strong spare.',
  rows:[['Shape & profile','All-rounder · Cross Profile (camber between the feet) · soft-to-medium flex · 275 mm waist · 1245 mm effective edge'],['Stance width','58–62 cm — start on the reference inserts'],['Angles ({s})','{F} foot (front) +15°, {b} foot (back) −9°'],['Alternative','+18° / −9° if your toes hang over more than about 2 cm'],['Position','Reference stance'],['Use it for','Your spare: switch to it if the Cinema chatters or slides out on hard snow']]}],
 stanceProse:`<h2>Why these numbers</h2><ul><li><b>Width:</b> a good starting width is roughly floor to mid-kneecap, a bit wider than your shoulders. At {cm} cm that lands around {w1}–{w2} cm. Too narrow and you feel tippy; too wide and your knees cannot steer.</li><li><b>Angles:</b> a mild duck stance (front positive, back slightly negative) keeps hips and knees neutral, makes side-slips and falling leaf natural, and still points you forward enough to steer with the front knee. {S} means your <b>{f} foot is the front foot</b>.</li><li><b>Check on the board:</b> the reference inserts are marked on the topsheet{p} (I do not have Nitro's exact reference-stance figures for your model years){/p}. Measure centre-of-disc to centre-of-disc with a tape.</li></ul>
 {p}<h3>Your boots: Vans OG Boa and Nike Vapen (US 13 / EU 47)</h3><ul><li><b>Re-centre when you swap boots:</b> the two pairs have different sole lengths, so check toe and heel overhang again each time.</li><li><b>Toe and heel drag:</b> EU 47 is a long boot. Toes and heels should overhang equally and by no more than about 2 cm. If they stick out further, turn both angles up a step (+18° / −12°).</li><li><b>Which pair:</b> ride the pair that holds your heel down best when you flex forward. Nike stopped making snowboard boots in 2014, so the Vapens are over ten years old: check that the liners are not packed out and the soles are not coming loose before you rely on them for a week.</li><li><b>Boa:</b> tighten again after the first two runs; boots loosen as they warm up.</li></ul>{/p}
 <h3>{bind}</h3><ul><li><b>Size:</b> {p}size L is right for your US 13 / EU 47 boots. {/p}Check that the boot sits snug in the heel cup with no side gap.</li><li><b>Centre the boot:</b> strapped in, toe and heel should overhang the edges equally (about 1–2 cm each is fine{p} on your wide boards{/p}). Slide the disc to adjust.</li><li><b>Highback:</b> rotate it so it runs parallel to the heel edge. Start with little forward lean; add a notch if heelside turns feel weak or chattery.</li><li><b>Straps:</b> ankle strap centred over the boot, toe strap cupping the front of the toe, not sitting on top.</li><li><b>Every morning:</b> check all disc screws are tight.{h} Heavy riders loosen hardware quickly.{/h}</li></ul>
 <h3>Worth packing</h3><ul><li>Helmet, wrist guards and impact shorts — they let you commit to new moves without fear of the fall.</li><li>A pocket multi-tool for stance tweaks on the hill. Change one thing at a time and ride three runs before judging.</li></ul>`,
 sk:['Not yet','Practising','Solid'],redH:'Red-ready',
 techIntro:'Work through the skills in order on snow. Tap the button on each to track it. One focus per run — never three.',
 gfx:{flatHint:['hint of edge,','never dead flat'],level:'head stays level',legs:'legs = suspension',trav:'long traverse = low speed',turnHere:'turn where it is widest',back:'✗ back seat',side:'side view',speed:'speed',down:'downhill',toe:'toe edge',heel:'heel edge',stiff:'✗ stiff',stacked:'✓ soft & stacked',slide:'slide',stop:'stop',front:'front knee leads',round:'✓ round C = control',zig:'✗ Z = speed',tall:'tall = edge change',low:'low = turn finish',here:'change edge here',late:'too late',corridor:'≈ 5 m corridor',skid:'skid: wide smear',carve:'carve: pencil line'},
 skills:[
 ['1 · Stacked stance','Everything else fails without this.',['Ankles, knees and hips all flexed — like sitting on a tall bar stool.','Weight 50/50, or slightly on the front ({f}) foot. Never the back foot.','Shoulders and hips in line with the board, hands low and quiet over nose and tail.','Eyes up, looking where you want to go — not at the board.'],'Drill: on a gentle blue, ride a traverse touching both knees with your hands, then stand tall, then low again. Find the middle.'],
 ['2 · Edge control: side-slip & falling leaf','Your brakes and your escape hatch on any red.',['Side-slip on toes and on heels for 30 m each, dead straight, smooth speed.','Control speed by tilting the edge with ankles and knees, not by leaning the body uphill.','Falling leaf on both edges — this also teaches you a little switch riding.'],'Drill: side-slip, stop completely, release, stop. Five stops per edge on the steepest part of a blue.'],
 ['3 · Steer with the front foot','The fix for "kicking" the back foot around.',['To start a toeside turn: press the {f} big toe down and drive the {f} knee toward the nose and into the turn.','To start a heelside turn: lift the {f} toes and open the {f} knee toward the heel edge.','The back foot follows a split second later — it never leads.'],'Drill: garlands. Traverse, let the nose drop toward the fall line by pedalling the front foot, then steer back to the same edge. 5 per side before linking.'],
 ['4 · Turn shape = speed control','On reds you control speed by finishing turns, not by braking.',['Draw round C-shapes. Keep steering until the board points across the hill (even slightly uphill).','Count "1-2-3" evenly through every turn: start – fall line – finish.','Feeling fast? Finish the turn more. Do not skid sideways.'],'Drill: funnel. Start with huge turns using the whole piste and make each one a bit smaller for 10 turns, then grow them again.'],
 ['5 · Flex & extend','Pressure control — grip and smoothness.',['Extend (stand taller) as you start the turn to make the edge change light.','Sink progressively through the second half of the turn to load the edge and absorb chatter.','On steeper pitches reverse it later: stay low and change edges by pulling the knees up.'],'Drill: exaggerate it. Tall at every edge change, touching your boots at every turn finish.'],
 ['6 · Early edge change','The single biggest difference between blue and red riding.',['Change to the new edge while the board still points across the hill — before the fall line.','It feels like falling downhill for a moment. Commit: shoulders stay level with the slope, weight on the front foot.','If you wait until the board points straight down, you pick up speed and panic-skid.'],'Drill: on an easy blue, at the end of each turn hop gently from the old edge to the new one while still traversing.'],
 ['7 · Short turns in a corridor','Your steep-slope tool.',['Pick a corridor about one groomer-track wide (≈ 5 m) and stay inside it.','Quick rhythm: legs rotate under a quiet upper body facing down the corridor.','Each turn ends with a brief firm edge set — that is the speed check.'],'Drill: 10 short turns, 3 big turns, 10 short turns. Count out loud to keep the rhythm.'],
 ['8 · First carves','Riding the edge instead of skidding. This is where it gets addictive.',['Gentle wide blue, moderate speed. Tilt the board with knees and ankles and just wait — let the sidecut turn you.','Look back at your track: a thin pencil line means carving, a wide smear means skidding.','Toeside: hips forward and over the edge. Heelside: sit down into it, chest up — do not fold at the waist.'],'Drill: carved traverses across the hill first, then single carved J-turns, then link two.'],
 ['9 · Flats, cat tracks & one-foot riding','Link tracks between sectors are long and flat — this is where edges get caught.',['Never ride a dead-flat base: keep a hint of toe or heel edge and roll gently from one to the other.','Carry speed in: look far ahead, get low, and stay off the brakes before the flat starts.','Weight on the front foot and legs soft; a stiff back leg is what catches the edge.','One foot out: back foot against the back binding, look ahead and glide straight — for lift exits and skating.'],'Drill: on a flat track make ten barely visible edge changes without the board leaving its line. On day 1, skate 50 m and glide off the lift without putting a foot down.'],
 ['10 · Absorbing bumps & chopped snow','By the afternoon every piste is bumpy. Your legs are the suspension.',['Stay low with your knees pointing out; let the board come up toward you on a bump and push it back down into the dip.','Head and shoulders travel in a level line while the legs work underneath.','Back straight, hands low and forward — folding at the waist throws you over the nose.','Turn on top of a bump: the board pivots easily there because nose and tail are free.'],'Drill: traverse across a bumpy piste and keep your head level; then turn on top of every third bump.'],
 ['11 · Steep-slope tactics','How you ride a red before you can ride it fast.',['Stop at the top, look down and plan: where is it widest, where is the snow soft, where will you stop.','Long traverses keep the speed low; make the turn where the slope is widest or eases off.','Commit to the turn with weight on the front foot, then finish it across the hill before the next traverse.','Too steep or icy for a turn? Side-slip that section. Nobody is keeping score.'],'Drill: ride a steep blue pitch with exactly four turns and long traverses, stopping at a spot you picked from the top.']],
 fixH:'Fix-it guide',fixTh:['What you feel','Usual cause','Fix'],
 fixes:[['Back foot swings round, turns feel like windscreen wipers','Steering with the upper body and back leg','Skill 3 — garlands, front knee leads'],['Speed runs away on steeper bits','Weight on the back foot; turns not finished','Skill 4 — finish across the hill; press the front shin into the boot'],['Heelside chatters and skips','Legs straight, bent at the waist','Bend knees, sit lower, chest up; add one notch of highback forward lean'],['Toeside feels blind and scary','Bending forward instead of pushing hips over the edge','Hips forward, shins into boot tongues, look over the front shoulder'],['Catching edges on flats and cat tracks','Riding a flat base with stiff legs','Keep a tiny bit of toe or heel edge engaged; stay soft'],['Board slides out on ice or hard snow','Edging hard and suddenly, or leaning the body into the hill','Stay over the board and edge gently and progressively; no sudden moves. Look for softer snow at the piste edges']],
 testH:'The red-ready test',testIntro:'Tick all of these on a blue and a groomed red is well within reach.',
 tests:['Link turns top to bottom on any blue without stopping','Quick controlled stop on both toe and heel edge','Side-slip the steepest blue pitch on both edges, in a straight line','10 short turns inside a one-groomer-wide corridor','Change turn size on command: big, medium, small','Ride a blue cat track without catching an edge','Still riding with good posture on the last run of the day'],

  groups:[['Warm-up and drill blues','Days 1–2. Steady, moderate gradient: room to practise skills 1–5 without picking up too much speed.'],['Step-up blues','Day 3. Noticeably steeper blues: use them for early edge changes and short turns, skills 6–7.'],['Your first reds','Day 4. The reds whose steepest part is the mildest. Ride them in the morning, freshly groomed, with skill 11.'],['Reds to save for later','These have a steep section of over 40%. Leave them until the first reds feel easy.'],['Flat sections: carry speed','Barely any gradient. Keep your speed, stay low and hold a hint of edge, skill 9.']],

 bring:`<h2>Your board line-up</h2><ol><li><b>Nitro Cinema 162</b> — your main board for days 1–4, the drills and your first reds. Loose and forgiving.</li><li><b>Nitro Magnum Ti 171W</b> — from day 5, once your turns are confident. Fast, stiff and stable.</li><li><b>Salomon Sight 166W</b> — your third option and spare. On paper it fits your weight and EU 47 boots best, so reach for it if the Cinema chatters or slides out on hard snow.</li></ol>`,
 notes:{h:'Your lesson notes from last year',groups:[['Posture',['Look where you are going','Weight on the front leg','Straight back, bend the knees — squat position','Knees out and bent to absorb the hits','Do not stand too open: body in line with the board','Hands at your hips, so you stay pointed forward']],['The turn in three parts',['1 · Run-up','2 · Let it fall and wait until the board points straight down','3 · Steer','Then link them into S-turns']],['Heel side and toe side',['One turn like sitting down, hips back','The other by pushing the hips forward — hands on your back or bum helps']],['Arms',['Point with your arms where you want to go','Point your arms down the hill']]],
  coach:'<b>Coach:</b> these are the right foundations and they match skills 1–4, so keep all of them. One thing changes for red slopes: in part 2 you wait until the board points straight down before you steer. On a steeper slope that wait is where the speed comes from. Skill 6 moves the edge change earlier, while the board still points across the hill.'},

 tripIntro:d=>`<h2>{resort}: game plan</h2><p>{p}A big linked area of six villages with a lot of wide, mellow blues — a very good place to make this step. {/p}From ${d}.</p><ul>{p}<li><b>Flats:</b> the link pistes between sectors have long flat stretches. Carry speed in, stay low on a nearly flat base with a hint of edge, and expect to unstrap now and then. Practise one-foot skating on day 1.</li>{/p}<li><b>Pick reds by condition, not by name:</b> wide, groomed that morning, in the sun, before 11:00. The same red at 15:30 — scraped and bumped — is a different slope. Check the current piste map and grooming report on the day.</li><li><b>Energy:</b> most injuries happen late in the afternoon. Stop one run early, every day.</li></ul>`,
 trip:[
 ['Find your feet','Cinema','Easy greens and blues. Skills 1–2 and 9: posture, side-slips, stops, one-foot skating. Check bindings and stance width feel right. Stop while you are still fresh.'],
 ['Turn shape','Cinema','Wide blues. Skills 3–4: front-foot steering, garlands, funnel turns. Aim for full runs with no stops.'],
 ['Get dynamic','Cinema','Steeper blues. Skills 5–6: flex/extend and early edge change. Ideal day for a 2-hour private lesson — an instructor will fix in an hour what takes a week alone.'],
 ['First red','Cinema','Run the red-ready test on a blue first. Then choose a wide, freshly groomed red before 11:00, look at it from the lift, and ride it with skills 7 and 11. Side-slipping the steep bit is allowed. Lap it three times.'],
 ['Carve & charge','Magnum Ti','Morning on wide blues{p} with the Magnum{/p}: skill 8, first carves. Afternoon: two or three different reds.'],
 ['Tour day','Your pick','Ride across the linked sectors with your friends and enjoy what you built. Agree on a last run before you take it — never "one more".']],
 mornings:`<h2>Every morning</h2><ul><li>10 minutes before the first lift: leg swings, squats, hip circles, torso twists.</li><li>First run is always an easy one.</li><li>Pick one skill for the day and say it out loud on the lift.</li><li>Ask a friend to film two turns from below. Compare it with the Fix-it guide in the evening.</li></ul>`},

 boards:[
 {role:'Je hoofdboard: een directional twin met het Gullwing-profiel van Nitro — rocker tussen je voeten, camber onder elke binding. Daardoor voelt het los, draait het makkelijk en haak je minder snel een kant; precies goed voor oefeningen en je eerste rode pistes. De keerzijde is minder kantgrip op snelheid en op harde sneeuw, en met {kg} kg zit je aan de bovengrens van wat een 162 prettig vindt, dus het gaat trillen als je het pusht.',
  rows:[['Vorm & profiel','Directional twin · Gullwing (rocker in het midden, camber onder de bindingen) · radiale sidecut · all-terrain flex · extruded base'],['Zo rij je het','De rocker voelt los op vlakke ziehwegen: hou altijd een vleugje kant vast. Kantel het bij carven verder dan natuurlijk aanvoelt. De extruded base is trager op vlakke stukken, dus laat het vóór de reis vers waxen.'],['Stancebreedte','58–60 cm — begin op de referentie-inserts, ga één gat breder als je knieën bekneld aanvoelen'],['Hoeken ({s})','{F}voet (voor) +15°, {b}voet (achter) −9°'],['Alternatief','+18° / −6° als je achterste knie gedraaid aanvoelt'],['Positie','Referentiestance, gecentreerd tussen teen- en hielkant'],['Gebruik het voor','Dag 1–4 van de reis, alle oefeningen, je eerste rode pistes']]},
 {role:'Het kanon voor grote rijders. Lang, stijf en gedempt — rotsvast op snelheid en gebouwd voor jouw postuur, maar het heeft snelheid en lef nodig om te buigen en straft achteroverhangen af. Pak het zodra je bochten zelfverzekerd zijn.',
  rows:[['Stancebreedte','60–62 cm op de referentie-inserts'],['Hoeken ({s})','{F}voet (voor) +18°, {b}voet (achter) −6°'],['Alternatief','+21° / 0° voor een carvedag op strakke pistes'],['Positie','Hou de referentie-setback aan — het is een directioneel board, centreer het niet'],['Gebruik het voor','Dag 5–6: carven op brede blauwe en snelle geprepareerde rode pistes']]},
 {role:'Je derde optie. Een allrounder met camber tussen je voeten, dus duidelijk meer grip op harde sneeuw dan de Cinema, terwijl de zacht-tot-medium flex hem vergevingsgezind houdt. Met 166 cm en een waist van 275 mm past hij op papier van je drie boards het best bij {kg} kg en schoenmaat EU 47, wat hem een sterke reserve maakt.',
  rows:[['Vorm & profiel','Allrounder · Cross Profile (camber tussen de voeten) · zacht-tot-medium flex · waist 275 mm · effectieve kant 1245 mm'],['Stancebreedte','58–62 cm — begin op de referentie-inserts'],['Hoeken ({s})','{F}voet (voor) +15°, {b}voet (achter) −9°'],['Alternatief','+18° / −9° als je tenen meer dan ongeveer 2 cm uitsteken'],['Positie','Referentiestance'],['Gebruik het voor','Je reserve: wissel ernaar als de Cinema gaat trillen of wegglijdt op harde sneeuw']]}],
 stanceProse:`<h2>Waarom deze getallen</h2><ul><li><b>Breedte:</b> een goede startbreedte is ongeveer de afstand van de vloer tot het midden van je knieschijf, iets breder dan je schouders. Bij {cm} cm kom je uit rond {w1}–{w2} cm. Te smal en je voelt je wankel; te breed en je knieën kunnen niet meer sturen.</li><li><b>Hoeken:</b> een milde duck stance (voor positief, achter licht negatief) houdt heupen en knieën neutraal, maakt side-slippen en falling leaf natuurlijk, en wijst je toch genoeg naar voren om met je voorste knie te sturen. {S} betekent dat je <b>{f}voet de voorste voet</b> is.</li><li><b>Controleer op het board:</b> de referentie-inserts staan op de topsheet gemarkeerd{p} (ik heb de exacte referentiematen van Nitro voor jouw modeljaren niet){/p}. Meet met een meetlint van midden disc tot midden disc.</li></ul>
 {p}<h3>Je schoenen: Vans OG Boa en Nike Vapen (US 13 / EU 47)</h3><ul><li><b>Opnieuw centreren als je van schoen wisselt:</b> de twee paren hebben een andere zoollengte, dus controleer elke keer hoeveel tenen en hiel uitsteken.</li><li><b>Slepende tenen en hielen:</b> EU 47 is een lange schoen. Tenen en hiel moeten evenveel uitsteken, en niet meer dan ongeveer 2 cm. Steken ze verder uit, zet dan beide hoeken een stap hoger (+18° / −12°).</li><li><b>Welk paar:</b> rij op het paar dat je hiel het best omlaag houdt als je naar voren buigt. Nike is in 2014 gestopt met snowboardschoenen, dus de Vapens zijn meer dan tien jaar oud: controleer of de binnenschoenen niet zijn ingezakt en de zolen niet loslaten voordat je er een week op vertrouwt.</li><li><b>Boa:</b> draai na de eerste twee afdalingen nog een keer aan; schoenen worden losser als ze opwarmen.</li></ul>{/p}
 <h3>{bind}</h3><ul><li><b>Maat:</b> {p}maat L klopt voor jouw schoenen in US 13 / EU 47. {/p}Controleer of de schoen strak in de heelcup zit, zonder ruimte aan de zijkanten.</li><li><b>Schoen centreren:</b> vastgeklikt moeten tenen en hiel evenveel over de kanten uitsteken (ongeveer 1–2 cm per kant is prima{p} op jouw wide boards{/p}). Verschuif de disc om bij te stellen.</li><li><b>Highback:</b> draai hem zo dat hij parallel loopt aan de hielkant. Begin met weinig forward lean; zet er een tandje bij als heelside-bochten zwak of stuiterig aanvoelen.</li><li><b>Straps:</b> enkelstrap midden over de schoen, teenstrap vóór om de neus van de schoen, niet er bovenop.</li><li><b>Elke ochtend:</b> controleer of alle discschroeven vastzitten.{h} Bij zware rijders trilt alles sneller los.{/h}</li></ul>
 <h3>Meenemen loont</h3><ul><li>Helm, polsbeschermers en een valbroek — daarmee durf je nieuwe bewegingen aan zonder angst voor de val.</li><li>Een zak-multitool om je stance op de piste bij te stellen. Verander één ding tegelijk en rij drie afdalingen voor je oordeelt.</li></ul>`,
 sk:['Nog niet','Aan het oefenen','Beheerst'],redH:'Red-ready',
 techIntro:'Werk de vaardigheden op volgorde af in de sneeuw. Tik op de knop om bij te houden hoe ver je bent. Eén focuspunt per afdaling — nooit drie.',
 gfx:{flatHint:['vleugje kant,','nooit helemaal vlak'],level:'hoofd blijft op één hoogte',legs:'benen = vering',trav:'lange traverse = lage snelheid',turnHere:'draai waar het het breedst is',back:'✗ achterover',side:'zijaanzicht',speed:'snelheid',down:'dalwaarts',toe:'teenkant',heel:'hielkant',stiff:'✗ stijf',stacked:'✓ soepel & in balans',slide:'glijden',stop:'stop',front:'voorste knie stuurt',round:'✓ ronde C = controle',zig:'✗ Z = snelheid',tall:'lang = kantwissel',low:'laag = einde bocht',here:'wissel hier van kant',late:'te laat',corridor:'corridor ≈ 5 m',skid:'slippen: breed spoor',carve:'carven: potloodlijn'},
 skills:[
 ['1 · Gestapelde houding','Zonder dit werkt de rest niet.',['Enkels, knieën en heupen allemaal gebogen — alsof je op een hoge barkruk zit.','Gewicht 50/50, of iets meer op je voorste ({f})voet. Nooit op je achterste voet.','Schouders en heupen in lijn met het board, handen laag en rustig boven nose en tail.','Ogen omhoog, kijk waar je heen wilt — niet naar je board.'],'Oefening: rij op een makkelijke blauwe piste een traverse en raak met je handen je knieën aan, ga dan lang staan, dan weer laag. Zoek het midden.'],
 ['2 · Kantcontrole: side-slip & falling leaf','Je remmen en je nooduitgang op elke rode piste.',['Side-slip 30 m op je tenen en 30 m op je hielen, kaarsrecht en met gelijkmatige snelheid.','Regel je snelheid door de kant te kantelen met enkels en knieën, niet door met je lichaam naar de berg te hangen.','Falling leaf op beide kanten — daarmee leer je meteen een beetje switch rijden.'],'Oefening: side-slip, helemaal stoppen, loslaten, stoppen. Vijf stops per kant op het steilste stuk van een blauwe piste.'],
 ['3 · Sturen met je voorste voet','De oplossing voor het "wegtrappen" van je achterste voet.',['Toeside-bocht inzetten: druk je {f} grote teen omlaag en duw je {f}knie richting nose en de bocht in.','Heelside-bocht inzetten: trek je {f}tenen op en open je {f}knie richting hielkant.','Je achterste voet volgt een fractie later — die leidt nooit.'],'Oefening: garlands. Rij een traverse, laat de nose richting vallijn zakken door met je voorste voet te "pedaleren" en stuur terug naar dezelfde kant. 5 per kant voordat je bochten aan elkaar rijgt.'],
 ['4 · Bochtvorm = snelheidscontrole','Op rood regel je je snelheid door bochten af te maken, niet door te remmen.',['Teken ronde C-vormen. Blijf sturen tot het board dwars op de helling staat (zelfs een beetje bergop).','Tel gelijkmatig "1-2-3" door elke bocht: inzet – vallijn – afmaken.','Voelt het snel? Maak de bocht verder af. Niet zijwaarts wegslippen.'],'Oefening: trechter. Begin met enorme bochten over de hele pistebreedte en maak ze 10 bochten lang telkens iets kleiner, daarna weer groter.'],
 ['5 · Buigen & strekken','Drukcontrole — grip en souplesse.',['Strek (kom omhoog) bij de inzet van de bocht om de kantwissel licht te maken.','Zak geleidelijk door de tweede helft van de bocht om de kant te belasten en trillingen op te vangen.','Op steilere stukken draai je het later om: blijf laag en wissel van kant door je knieën op te trekken.'],'Oefening: overdrijf het. Lang bij elke kantwissel, schoenen aantikken aan het eind van elke bocht.'],
 ['6 · Vroege kantwissel','Het grootste verschil tussen blauw en rood rijden.',['Wissel naar de nieuwe kant terwijl het board nog dwars op de helling staat — vóór de vallijn.','Het voelt even alsof je dalwaarts valt. Ga ervoor: schouders parallel aan de helling, gewicht op je voorste voet.','Wacht je tot het board recht naar beneden wijst, dan maak je snelheid en ga je in paniek slippen.'],'Oefening: maak op een makkelijke blauwe piste aan het eind van elke bocht een klein sprongetje van de oude naar de nieuwe kant, terwijl je nog traverseert.'],
 ['7 · Korte bochten in een corridor','Je gereedschap voor steile stukken.',['Kies een corridor van ongeveer één pistenbullyspoor breed (≈ 5 m) en blijf erbinnen.','Snel ritme: je benen draaien onder een rustig bovenlichaam dat de corridor in kijkt.','Elke bocht eindigt met een korte, stevige kantinzet — dat is je snelheidscheck.'],'Oefening: 10 korte bochten, 3 grote, 10 korte. Tel hardop om het ritme vast te houden.'],
 ['8 · Je eerste carves','Op de kant rijden in plaats van slippen. Hier wordt het verslavend.',['Brede, vlakke blauwe piste, matige snelheid. Kantel het board met knieën en enkels en wacht gewoon — laat de sidecut je draaien.','Kijk terug naar je spoor: een dunne potloodlijn is carven, een breed uitgesmeerd spoor is slippen.','Toeside: heupen naar voren en boven de kant. Heelside: ga erin zitten, borst omhoog — niet dubbelklappen in je middel.'],'Oefening: eerst gecarvede traverses dwars over de helling, dan losse gecarvede J-bochten, dan twee aan elkaar.'],
 ['9 · Vlakke stukken, ziehwegen & rijden met één voet','Verbindingspistes tussen sectoren zijn lang en vlak — hier haak je een kant.',['Rij nooit helemaal vlak: hou een vleugje teen- of hielkant vast en rol rustig van de ene naar de andere.','Neem snelheid mee: kijk ver vooruit, ga laag zitten en rem niet vlak voor het vlakke stuk.','Gewicht op je voorste voet en benen soepel; een stijf achterste been is wat de kant laat haken.','Eén voet los: achterste voet tegen de achterste binding, vooruit kijken en recht uitglijden — voor het uitstappen uit de lift en het steppen.'],'Oefening: maak op een vlak stuk tien nauwelijks zichtbare kantwissels zonder dat het board van zijn lijn afwijkt. Step op dag 1 50 m en glij uit de lift zonder een voet neer te zetten.'],
 ['10 · Bulten & omgewoelde sneeuw opvangen','Tegen de middag is elke piste bultig. Je benen zijn de vering.',['Blijf laag met je knieën naar buiten; laat het board op een bult naar je toe komen en duw het in de kuil weer omlaag.','Hoofd en schouders bewegen in een vlakke lijn terwijl je benen eronder werken.','Rug recht, handen laag en naar voren — dubbelklappen in je middel gooit je over de nose.','Draai bovenop een bult: daar pivoteert het board makkelijk omdat nose en tail vrij zijn.'],'Oefening: traverseer over een bultige piste en hou je hoofd op één hoogte; draai daarna bovenop elke derde bult.'],
 ['11 · Tactiek op steile stukken','Zo rij je een rode piste voordat je hem snel kunt rijden.',['Stop bovenaan, kijk naar beneden en maak een plan: waar is het het breedst, waar ligt zachte sneeuw, waar stop je.','Lange traverses houden de snelheid laag; maak de bocht waar de piste het breedst is of afvlakt.','Zet de bocht in met gewicht op je voorste voet en maak hem af dwars op de helling vóór de volgende traverse.','Te steil of te ijzig voor een bocht? Side-slip dat stuk. Niemand houdt de score bij.'],'Oefening: rij een steil stuk blauw met precies vier bochten en lange traverses, en stop op een plek die je van bovenaf hebt gekozen.']],

 fixes:[['Achterste voet zwaait rond, bochten voelen als ruitenwissers','Sturen met je bovenlichaam en achterste been','Vaardigheid 3 — garlands, voorste knie stuurt'],['Snelheid loopt uit de hand op steilere stukken','Gewicht op je achterste voet; bochten niet afgemaakt','Vaardigheid 4 — afmaken dwars op de helling; druk je voorste scheen in de schoen'],['Heelside trilt en stuitert','Benen gestrekt, voorovergebogen in je middel','Knieën buigen, lager zitten, borst omhoog; één tandje meer forward lean op de highback'],['Toeside voelt blind en eng','Voorover buigen in plaats van je heupen boven de kant duwen','Heupen naar voren, schenen in de tong van je schoenen, kijk over je voorste schouder'],['Kanten haken op vlakke stukken en ziehwegen','Vlak rijden met stijve benen','Hou altijd een klein beetje teen- of hielkant vast; blijf soepel'],['Board glijdt weg op ijs of harde sneeuw','Hard en plotseling opkanten, of met je lichaam naar de berg hangen','Blijf boven je board en kant rustig en geleidelijk op; geen plotselinge bewegingen. Zoek de zachtere sneeuw aan de pisteranden']],

  groups:[['Blauwe pistes om in te rijden en te oefenen','Dag 1–2. Gelijkmatige, matige helling: ruimte om vaardigheid 1–5 te oefenen zonder te veel snelheid te maken.'],['Blauwe pistes als volgende stap','Dag 3. Duidelijk steilere blauwe pistes: gebruik ze voor vroege kantwissels en korte bochten, vaardigheid 6–7.'],['Je eerste rode pistes','Dag 4. De rode pistes waarvan het steilste stuk het mildst is. Rij ze in de ochtend, vers geprepareerd, met vaardigheid 11.'],['Rode pistes voor later','Deze hebben een steil stuk van meer dan 40%. Bewaar ze tot de eerste rode pistes makkelijk voelen.'],['Vlakke stukken: neem snelheid mee','Nauwelijks helling. Hou je snelheid vast, blijf laag en hou een vleugje kant vast, vaardigheid 9.']],

 bring:`<h2>Jouw boards op volgorde</h2><ol><li><b>Nitro Cinema 162</b> — je hoofdboard voor dag 1–4, de oefeningen en je eerste rode pistes. Los en vergevingsgezind.</li><li><b>Nitro Magnum Ti 171W</b> — vanaf dag 5, zodra je bochten zelfverzekerd zijn. Snel, stijf en stabiel.</li><li><b>Salomon Sight 166W</b> — je derde optie en reserve. Op papier past hij het best bij je gewicht en schoenmaat EU 47, dus pak hem als de Cinema gaat trillen of wegglijdt op harde sneeuw.</li></ol>`,
 notes:{h:'Je lesnotities van vorig jaar',groups:[['Houding',['Kijken waar je heen gaat','Gewicht op je voorste been','Rechte rug en door de knieën — squathouding','Knieën naar buiten en buigen om de klappen op te vangen','Niet te open staan: lichaam recht op het board','Handen in de heup, zodat je naar voren gericht blijft']],['De bocht in drie delen',['1 · Aanloop','2 · Laten vallen en wachten tot het board recht naar beneden staat','3 · Sturen','Daarna aan elkaar rijgen tot S-jes']],['Hiel- en teenkant',['De ene bocht als zitten, heupen naar achter','De andere door je heupen naar voren te drukken — handen in je rug of op je billen helpt']],['Armen',['Met je armen wijzen waar je heen wilt','Met je armen naar beneden wijzen']]],
  coach:'<b>Coach:</b> dit is precies de goede basis en het sluit aan op vaardigheid 1–4, dus hou het allemaal vast. Voor rode pistes verandert één ding: in deel 2 wacht je tot het board recht naar beneden staat voordat je stuurt. Op een steilere piste komt daar je snelheid vandaan. Vaardigheid 6 haalt de kantwissel naar voren, terwijl het board nog dwars op de helling staat.'},

 tripIntro:d=>`<h2>Plan voor {resort}</h2><p>{p}Een groot aaneengesloten gebied van zes dorpen met veel brede, vlakke blauwe pistes — een heel goede plek om deze stap te zetten. {/p}Vanaf ${d}.</p><ul>{p}<li><b>Vlakke stukken:</b> de verbindingspistes tussen de sectoren hebben lange vlakke stukken. Neem snelheid mee, blijf laag op een bijna vlak board met een vleugje kant, en reken erop dat je af en toe moet losklikken. Oefen steppen met één voet op dag 1.</li>{/p}<li><b>Kies rode pistes op conditie, niet op naam:</b> breed, die ochtend geprepareerd, in de zon, vóór 11:00 uur. Dezelfde rode om 15:30 uur — kaalgeschraapt en vol bulten — is een andere piste. Bekijk op de dag zelf de actuele pistekaart en het preparatierapport.</li><li><b>Energie:</b> de meeste blessures gebeuren laat in de middag. Stop elke dag één afdaling te vroeg.</li></ul>`,
 trip:[
 ['Erin komen','Cinema','Makkelijke groene en blauwe pistes. Vaardigheid 1–2 en 9: houding, side-slips, stoppen, steppen met één voet. Check of bindingen en stancebreedte goed voelen. Stop terwijl je nog fris bent.'],
 ['Bochtvorm','Cinema','Brede blauwe pistes. Vaardigheid 3–4: sturen met de voorste voet, garlands, trechterbochten. Doel: hele afdalingen zonder te stoppen.'],
 ['Dynamisch worden','Cinema','Steilere blauwe pistes. Vaardigheid 5–6: buigen/strekken en vroege kantwissel. Ideale dag voor 2 uur privéles — een instructeur lost in een uur op waar je alleen een week over doet.'],
 ['Eerste rode','Cinema','Doe eerst de red-ready-test op een blauwe piste. Kies dan vóór 11:00 uur een brede, vers geprepareerde rode, bekijk hem vanuit de lift en rij hem met vaardigheid 7 en 11. Het steile stuk side-slippen mag. Rij hem drie keer.'],
 ['Carven & gas geven','Magnum Ti','Ochtend op brede blauwe pistes{p} met de Magnum{/p}: vaardigheid 8, je eerste carves. Middag: twee of drie verschillende rode pistes.'],
 ['Tourdag','Jouw keuze','Trek met je vrienden door de verbonden sectoren en geniet van wat je hebt opgebouwd. Spreek een laatste afdaling af vóórdat je hem rijdt — nooit "nog eentje".']],
 mornings:`<h2>Elke ochtend</h2><ul><li>10 minuten vóór de eerste lift: beenzwaaien, squats, heupcirkels, romprotaties.</li><li>De eerste afdaling is altijd een makkelijke.</li><li>Kies één vaardigheid voor de dag en zeg hem hardop in de lift.</li><li>Vraag een vriend om twee bochten van onderaf te filmen. Vergelijk dat 's avonds met de Probleemoplosser.</li></ul>`}};
let T=C[S.lang]||C.en;

// ---------- sessions ----------
const pick=(v,p)=>Array.isArray(v)?v[p]:v;
function dose(e,p,l){const u=pick(e.u,p);let n=pick(e.n,p);if(n==null)return'';
 n*=1+.1*l;n=u[0]==='s'?Math.round(n/5)*5:Math.max(1,Math.round(n));
 return(e.sets>1?e.sets+' × ':'')+n+' '+T.u[u]}
const exercises=(t,p)=>DOSE[t].map((d,i)=>({sets:pick(d[0],p),n:d[1],u:d[2],name:pick(T.ses[t].ex[i][0],p),cue:T.ses[t].ex[i][1]})).filter(e=>e.sets>0);
function adherence(){let due=0,done=0;const end=TODAY<P.trip?TODAY:add(P.trip,-1);
 for(let d=P.start;d<=end;d=add(d,1)){if(typeOf(d)==='R')continue;if(P.done[d]){due++;done++}else if(d<TODAY)due++}
 return due?Math.round(100*done/due):100}

// ---------- graphics ----------
function boardSvg(b){const k=380/b.len,cx=200-(b.sb?10:0),dx=b.w*k/2,foot=(x,a,l)=>`<g transform="${REG()?'translate(0 110) scale(1 -1) ':''}rotate(${a} ${x} 55)"><rect x="${x-12}" y="22" width="24" height="66" rx="8" fill="var(--blue)" opacity=".85"/><circle cx="${x}" cy="30" r="4" fill="#fff"/></g><text x="${x}" y="118" text-anchor="middle" font-size="11" fill="currentColor">${l} ${a>0?'+':''}${a}°</text>`;
 return`<svg viewBox="0 0 400 124" role="img" aria-label="${b.name}"><rect x="10" y="28" width="380" height="54" rx="27" fill="var(--soft)" stroke="var(--line)" stroke-width="2"/>
 ${foot(cx-dx,b.b,T.svg.back)}${foot(cx+dx,b.f,T.svg.front)}
 <line x1="${cx-dx}" y1="100" x2="${cx+dx}" y2="100" stroke="currentColor" stroke-dasharray="3 3"/><text x="${cx}" y="97" text-anchor="middle" font-size="11" fill="currentColor">${b.w} cm</text>
 <text x="386" y="14" text-anchor="end" font-size="11" fill="var(--red)">${T.svg.nose}</text><text x="14" y="14" font-size="11" fill="currentColor">${T.svg.tail}</text></svg>`}

// Technique animations. Fixed "snow" palette (not themed). Slope is seen from above, downhill = down the screen.
// The rider glyph is drawn nose toward +x as a goofy rider (toe edge at -y); for a regular rider it is mirrored and the edges swap.
const K={ink:'#12212f',mute:'#5b6b7b',ok:'#12975a',red:'#e2283f',toe:'#1f6feb',heel:'#f07f09',board:'#1b2b3f',jacket:'#7b3fe4',pants:'#26384d',gog:'#ffd76a',smear:'#9db7cf'};
const TURNS='M160 20C240 20 240 70 160 70C80 70 80 120 160 120C240 120 240 170 160 170'; // heelside, toeside, heelside
const txt=(x,y,s,fill=K.ink,anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}">${s}</text>`;
const loop=(attr,dur,values,extra='')=>`<animate attributeName="${attr}" dur="${dur}s" repeatCount="indefinite" values="${values}" ${extra}/>`;
const xform=(type,dur,values,extra='')=>`<animateTransform attributeName="transform" type="${type}" dur="${dur}s" repeatCount="indefinite" values="${values}" ${extra}/>`;
const discrete=n=>`calcMode="discrete" keyTimes="${Array.from({length:n},(_,i)=>(i/n).toFixed(3)).join(';')}"`;
const dashed=(d,col=K.mute,extra='')=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="4 4" ${extra}/>`;
// a line that is drawn as the rider travels along it
const trail=(d,dur,col,w=2.5,op=1)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${op}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">${loop('stroke-dashoffset',dur,'1;0')}</path>`;

// Top-view rider glyph. seq = the edge used on each equal part of the path ('t' toe / 'h' heel):
// the engaged edge lights up and the body leans over it. Options: front (pulse the steering foot), skid, quiet (upper body keeps facing downhill).
function glyph(dur,seq,o={}){const m=REG()?'scale(1 -1)':'',s=[...seq].map(e=>REG()?(e==='t'?'h':'t'):e),n=s.length,on=c=>s.map(e=>e===c?1:0).join(';');
 const edge=(c,y,col)=>`<path d="M-18 ${y}h36" stroke="${col}" stroke-width="4" stroke-linecap="round" opacity="${s[0]===c?1:0}">${n>1?loop('opacity',dur,on(c),discrete(n)):''}</path>`;
 const spray=o.skid?[[-12,-11,0],[0,-13,.2],[12,-11,.4]].map(([x,y,b])=>`<circle cx="${x}" cy="${y}" r="2" fill="${K.smear}"><animate attributeName="r" dur=".7s" begin="${b}s" repeatCount="indefinite" values="1;6"/><animate attributeName="opacity" dur=".7s" begin="${b}s" repeatCount="indefinite" values=".9;0"/><animate attributeName="cy" dur=".7s" begin="${b}s" repeatCount="indefinite" values="${y};${y-9}"/></circle>`).join(''):'';
 const board=`${spray}<rect x="-23" y="-6.5" width="46" height="13" rx="6.5" fill="${K.board}"/><rect x="15" y="-6.5" width="3" height="13" fill="#fff" opacity=".8"/>${edge('t',-7.5,K.toe)}${edge('h',7.5,K.heel)}
 <rect x="6" y="-7.5" width="7" height="15" rx="2" fill="${K.mute}" transform="rotate(15 9.5 0)"/><rect x="-13" y="-7.5" width="7" height="15" rx="2" fill="${K.mute}" transform="rotate(-9 -9.5 0)"/>
 ${o.front?`<circle cx="9.5" r="5" fill="${K.red}" opacity=".75">${loop('r',.9,'4;9;4')}${loop('opacity',.9,'.85;.25;.85')}</circle>`:''}`;
 const body=`<path d="M-9 0L-18 -1M9 0L18 -1" stroke="${K.jacket}" stroke-width="4.5" stroke-linecap="round"/><ellipse rx="10" ry="6.5" fill="${K.jacket}"/><circle cx="3" r="5.4" fill="${K.ink}"/><path d="M6.8 -3.8A5.4 5.4 0 0 1 6.8 3.8" stroke="${K.gog}" stroke-width="2.4" fill="none"/>`;
 const lean=[0,...s.map(e=>e==='t'?-3.5:3.5),0].map(y=>'0 '+y).join(';'),kt=[0,...s.map((_,i)=>((i+.5)/n).toFixed(3)),1].join(';');
 return{board:`<g transform="${m}">${board}</g>`,body,all:`<g transform="${m}${o.skid?' rotate(38)':''}">${board}<g>${xform('translate',dur,lean,`keyTimes="${kt}"`)}${body}</g></g>`}}
function rider(d,dur,seq,o={}){const p=glyph(dur,seq,o),move=rot=>`<animateMotion dur="${dur}s" repeatCount="indefinite" ${rot?'rotate="auto"':''} path="${d}"/>`;
 return o.quiet?`<g>${p.board}${move(1)}</g><g><g transform="rotate(90)">${p.body}</g>${move(0)}</g>`:`<g>${p.all}${move(1)}</g>`}

// Rider seen from the toe side of the board (nose to the left). h = 0 standing tall … 1 fully flexed; lean > 0 = weight toward the tail.
function pose(h,lean=0){const kx=18+10*h,ky=-26+6*h,hy=-48+18*h,sx=lean*1.3,sy=hy-30+4*h,ay=sy+22;
 return{legs:`M-22 -8L${-kx+lean*.5} ${ky}L${lean} ${hy}L${kx+lean*.5} ${ky}L22 -8`,torso:`M${lean} ${hy}L${sx} ${sy}`,arms:`M${sx-27} ${ay}L${sx} ${sy+3}L${sx+27} ${ay}`,head:`${sx} ${sy-15}`}}
function figure(x,y,poses,dur,keyTimes){const ps=poses.map(p=>pose(...[].concat(p))),kt=keyTimes?`keyTimes="${keyTimes}"`:'',moving=ps.length>1;
 const part=(k,col,w)=>`<path d="${ps[0][k]}" stroke="${col}" stroke-width="${w}">${moving?loop('d',dur,ps.map(p=>p[k]).join(';'),kt):''}</path>`;
 return`<g transform="translate(${x} ${y})" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="10" rx="48" ry="4" fill="${K.ink}" opacity=".12"/>
 <rect x="-44" y="1" width="88" height="6" rx="3" fill="${K.board}"/><rect x="-29" y="-11" width="14" height="12" rx="3" fill="${K.mute}"/><rect x="15" y="-11" width="14" height="12" rx="3" fill="${K.mute}"/>
 ${part('legs',K.pants,9)}${part('arms',K.jacket,6)}${part('torso',K.jacket,15)}
 <g transform="translate(${ps[0].head})">${moving?xform('translate',dur,ps.map(p=>p.head).join(';'),kt):''}<circle r="9.5" fill="${K.ink}"/><rect x="-8" y="-3.5" width="16" height="6.5" rx="3" fill="${K.gog}"/></g></g>`}

 if(id==='posture')b=txt(REG()?310:10,18,REG()?'nose →':'← nose',K.mute,REG()?'end':'start')+figure(58,142,[0])+txt(58,174,g.stiff,K.red)+figure(160,142,[[.45,REG()?-13:13]])+txt(160,174,g.back,K.red)+figure(262,142,[.45,.75,.45],2.6)+txt(262,174,g.stacked,K.ok);
 else if(id==='edges'){const kt='keyTimes="0;.2;.35;.55;.7;.9;1"',tilt='keyTimes="0;.17;.2;.35;.38;.52;.55;.7;.73;.87;.9;1"',flip='calcMode="discrete" keyTimes="0;.2;.35;.55;.7;.9"';

  <g>${loop('opacity',6,'1;0;1;0;1;0',flip)}${txt(230,168,'↓ '+g.slide,K.mute)}</g><g opacity="0">${loop('opacity',6,'0;1;0;1;0;1',flip)}${txt(230,168,'■ '+g.stop,K.red)}</g>`}
 else if(id==='steer'){const d='M20 40c25 0 35 30 55 30c15 0 20-8 35-8c25 0 35 30 55 30c15 0 20-8 35-8c25 0 35 30 55 30c15 0 20-8 35-8';
