 else if(id==='shape'){const mark=(x,y,n,t)=>`<g opacity=".3">${loop('opacity',6,'.3;1',`calcMode="discrete" keyTimes="0;${t}"`)}<circle cx="${x}" cy="${y}" r="10" fill="#fff" stroke="${K.ok}" stroke-width="2"/>${txt(x,y+4,n,K.ok)}</g>`;
  b=dashed('M70 25L250 70L70 115L250 160',K.red,'opacity=".45"')+trail(TURNS,6,K.ok,3)+mark(182,62,1,.333)+mark(88,95,2,.5)+mark(182,128,3,.667)+rider(TURNS,6,'hth')
  +`<rect x="292" y="50" width="12" height="100" rx="6" fill="#fff" stroke="${K.smear}"/><rect x="292" y="130" width="12" height="20" rx="6" fill="${K.heel}">${loop('height',6,'20;85;20;85;20;85;20')}${loop('y',6,'130;65;130;65;130;65;130')}</rect>`
  +txt(298,44,g.speed,K.mute)+txt(26,182,g.round,K.ok,'start')+txt(286,182,g.zig,K.red,'end')}
 else if(id==='flex'){const d='M225 20C275 20 275 70 225 70C175 70 175 120 225 120C275 120 275 170 225 170';
  b=dashed(d,K.smear)+trail(d,6,K.mute)+[70,120].map(y=>`<circle cx="225" cy="${y}" r="6" fill="${K.ok}"/>`).join('')+rider(d,6,'hth')
  +figure(88,134,[.05,1,.05,1,.05,1,.05],6,'0;.3;.37;.63;.7;.96;1')+txt(88,164,'● '+g.tall,K.ok)+txt(88,180,g.low,K.mute)}
 else if(id==='early'){const seg=(d,col)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" opacity=".55"/>`;
  const[e1,e2]=REG()?[K.toe,K.heel]:[K.heel,K.toe];
  b=seg('M160 20C240 20 240 70 160 70',e1)+seg('M160 70C80 70 80 120 160 120',e2)+seg('M160 120C240 120 240 170 160 170',e1)
  +[[160,70],[160,120]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${K.ok}">${loop('r',1.2,'5;10;5')}</circle>`).join('')
  +[[220,45],[100,95],[220,145]].map(([x,y])=>`<path d="M${x-5} ${y-5}l10 10m0-10l-10 10" stroke="${K.red}" stroke-width="3" stroke-linecap="round"/>`).join('')
  +rider(TURNS,7,'hth')+txt(148,64,g.here+' ●',K.ok,'end')+txt(234,49,'✗ '+g.late,K.red,'start')+txt(26,168,'▬ '+g.toe,K.toe,'start')+txt(26,182,'▬ '+g.heel,K.heel,'start')}
 else if(id==='short'){const d='M160 15'+'c22 0 22 26 0 26c-22 0-22 26 0 26'.repeat(3);
  b=`<path d="M126 8V182M194 8V182" stroke="${K.red}" stroke-dasharray="6 5" stroke-width="2"/>`+trail(d,5,K.mute)+rider(d,5,'hththt',{quiet:1})+txt(202,24,g.corridor,K.red,'start')}
 else if(id==='flats'){const d='M160 12Q146 56 160 100Q174 144 160 188';
  b=`<path d="M128 6V186M192 6V186" stroke="${K.smear}" stroke-width="3"/>`+trail(d,6,K.mute)+rider(d,6,'th')+txt(202,94,g.flatHint[0],K.ok,'start')+txt(202,108,g.flatHint[1],K.ok,'start')}
 else if(id==='bumps'){const kt='0;.25;.5;.75;1';   // head height is the same flexed on a crest as extended in a dip
  b=`<path d="M10 61H310" stroke="${K.ok}" stroke-dasharray="5 5" stroke-width="2"/>`+txt(306,52,g.level,K.ok,'end')
  +`<g>${xform('translate',2.4,'0 0;-80 0')}<path d="M-60 157${'q20 -35.2 40 0l40 0'.repeat(7)}V192H-60Z" fill="#fff" stroke="${K.smear}" stroke-width="2"/></g>`
  +`<g>${xform('translate',2.4,'0 0;0 0;0 -17.6;0 0;0 0',`keyTimes="${kt}"`)}${figure(160,150,[.2,.2,1,.2,.2],2.4,kt)}</g>`+txt(14,180,g.legs,K.mute,'start')}
 else if(id==='steep'){const d='M60 46L250 64C285 68 285 92 250 96L70 114C35 118 35 142 70 146L280 164';
  b=trail(d,9,K.mute)+[[276,80],[44,130]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="${K.ok}" stroke-width="2" stroke-dasharray="4 3"/>`).join('')+rider(d,9,'tht')+txt(306,34,g.trav,K.mute,'end')+txt(160,184,'◌ '+g.turnHere,K.ok)}
 else{const d='M0 20C50 20 50 70 0 70C-50 70-50 120 0 120C50 120 50 170 0 170';
  b=`<g transform="translate(92 0)">${trail(d,6,K.smear,22,.55)}${rider(d,6,'hth',{skid:1})}</g><g transform="translate(235 0)">${trail(d,5,K.ok,2.5)}${rider(d,5,'hth')}</g>`+txt(92,184,'✗ '+g.skid,K.red)+txt(235,184,'✓ '+g.carve,K.ok)}
 const side=id==='posture'||id==='bumps',slope=side?(id==='posture'?`<path d="M0 152H320V190H0Z" fill="#fff"/>`:''):`<rect width="320" height="190" fill="url(#cord)"/>${[20,65,110,155].map(y=>`<circle cx="7" cy="${y}" r="3" fill="${K.toe}"/><circle cx="313" cy="${y}" r="3" fill="${K.toe}"/>`).join('')}<path d="M22 10v24m-5-7l5 8l5-8" fill="none" stroke="${K.mute}" stroke-width="1.5"/>${txt(32,20,g.down,K.mute,'start')}`;
 return`<svg viewBox="0 0 320 190" role="img" aria-label="${T.skills[SKILL_IDS.indexOf(id)][0]}"><rect width="320" height="190" fill="${side?'#dcecf8':'#f3f9fe'}"/>${slope}${b}</svg>`}

// ---------- views ----------
const el=id=>document.getElementById(id);
function coach(){const left=diff(P.trip,TODAY),out=[];
 if(left<=0&&left>-6){const t=T.trip[-left];return T.tripDay(1-left,[t[0],P.preset?t[1]:T.yourBoard,t[2]])}
 if(left<=-6)return T.back;
 const w=weekOf(TODAY),p=phase(w),t=typeOf(TODAY);
 out.push(T.count(left,w+1,nWeeks(),T.phases[p],T.phaseWhy[p]));
 if(P.done[TODAY])out.push(T.todayDone);
 else if(t==='R'||t==='M'){for(let d=monday(TODAY);d<TODAY;d=add(d,1)){const m=typeOf(d);if(m&&'ABCZI'.includes(m)&&!P.done[d]){out.push(`${T.skipped(T.ses[m].title,T.days[dow(d)])} <button data-open="${d}">${T.open}</button>`);break}}}
 const last=Object.keys(P.fb).sort().pop();
 if(last&&P.fb[last]&&typeOf(last))out.push(T.rated(T.ses[typeOf(last)].title,P.fb[last]>0));
 return out.join('<br>')}

function sessionHtml(d){const t=typeOf(d);
 if(!t)return`<div class="card"><p class="mute">${T.none(fmt(d),fmt(P.start),fmt(P.trip))}</p></div>`;
 const p=phase(weekOf(d)),s=T.ses[t],l=lvl(t),chk=P.chk[d]||[];
 let h=`<div class="card"><span class="tag p${p}">${T.phases[p]}</span> <span class="tag">${T.days[dow(d)]} ${fmt(d)}</span>${l?` <span class="tag">${T.adjust} ${l>0?'+':''}${l*10}%</span>`:''}<h2 style="margin-top:8px">${s.title}</h2><p class="mute">${s.why}</p>`;
 exercises(t,p).forEach((e,i)=>h+=`<label class="ex"><input type="checkbox" data-chk="${d}|${i}" ${chk.includes(i)?'checked':''}><span><b>${e.name}</b> <span class="dose">${dose(e,p,l)}</span><br><small>${e.cue}</small></span></label>`);
 if(t!=='R'){h+=P.done[d]
  ?`<div class="row"><b style="color:var(--ok)">${T.complete}</b> ${T.how}${[1,0,-1].map((v,i)=>`<button class="${P.fb[d]===v?'pri':''}" data-fb="${d}|${v}">${T.fbs[i]}</button>`).join('')}<button data-done="${d}">${T.undo}</button></div>`
  :`<div class="row"><button class="pri" data-done="${d}">${T.finish}</button></div>`}
 return h+'</div>'}

function vToday(){const m=monday(sel);let strip='';
 for(let i=0;i<7;i++){const d=add(m,i),t=typeOf(d);strip+=`<button data-open="${d}" class="${d===sel?'sel ':''}${P.done[d]?'done ':''}${d===TODAY?'today':''}"><b>${T.days[i]}</b><br>${t?T.ses[t].short:'—'}</button>`}
 const left=Math.max(0,diff(P.trip,TODAY)),w=Math.min(nWeeks(),Math.max(1,weekOf(TODAY)+1));
 const vals=[left,`${w}/${nWeeks()}`,adherence()+'%',redReady()+'%'];
 return`<div class="card stats">${vals.map((v,i)=>`<div class="stat"><b>${v}</b>${T.stats[i]}</div>`).join('')}</div>
 <div class="card coach"><h2>${T.coach}</h2><p>${coach()}</p></div>
 <div class="card"><div class="strip">${strip}</div></div>${sessionHtml(sel)}`}

function vPlan(){let rows='';const n=nWeeks(),cur=weekOf(TODAY);
 for(let w=0;w<n;w++){const m=add(P.start,w*7);let done=0;for(let i=0;i<7;i++)if(P.done[add(m,i)])done++;
  rows+=`<tr data-open="${m}" class="${w===cur?'now':''}"><td>${w+1}</td><td>${fmt(m)} – ${fmt(add(m,6))}</td><td class="p${phase(w)}"><b>${T.phases[phase(w)]}</b></td><td>${done}/6</td></tr>`}
 return`<div class="card"><h2>${T.block}</h2><p>${T.tripStart} <input type="date" id="trip" value="${P.trip}" min="${add(P.start,7)}"> <small>${T.rescale}</small></p><p class="mute">${T.planNote}</p></div>
 <div class="card"><h2>${T.rhythm}</h2><table><tbody>${TEMPLATE.map((t,i)=>`<tr><td><b>${T.days[i]}</b></td><td>${T.ses[t].title}</td></tr>`).join('')}</tbody></table>
 <h3>${T.phasesH}</h3><ul>${T.phases.map((p,i)=>`<li><b class="p${i}">${p}</b> — ${T.phaseWhy[i]}</li>`).join('')}</ul>
 <h3>${T.rulesH}</h3><ul>${T.rules.map(r=>`<li>${r}</li>`).join('')}</ul></div>
 <div class="card"><h2>${T.allWeeks}</h2><table><thead><tr>${T.weekTh.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}

function vStance(){const list=P.preset?BOARDS.map((b,i)=>[b,T.boards[i]]):[[{name:T.yourBoard,len:158,w:Math.round(P.cm*.305),f:15,b:-9},T.gboard]];
 return(P.preset?`<div class="card">${T.bring}</div>`:'')+list.map(([b,t])=>`<div class="card"><h2>${b.name}</h2><p>${t.role}</p>${boardSvg(b)}<table>${t.rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></div>`).join('')+`<div class="card">${T.stanceProse}</div>`}

function redReady(){const tot=SKILL_IDS.length*2+T.tests.length;let got=0;SKILL_IDS.forEach(id=>got+=P.skill[id]||0);T.tests.forEach((_,i)=>got+=P.skill['t'+i]?1:0);return Math.round(100*got/tot)}
function vTech(){const r=redReady();
 return`<div class="card"><h2>${T.redH}: ${r}%</h2><div class="bar"><i style="width:${r}%"></i></div><p class="mute">${T.techIntro}</p></div>`+(P.preset?`<div class="card coach"><h2>${T.notes.h}</h2><div class="notes">${T.notes.groups.map(([t,items])=>`<div><h3>${t}</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div><p>${T.notes.coach}</p></div>`:'')+
 T.skills.map(([t,goal,how,drill],i)=>{const id=SKILL_IDS[i],v=P.skill[id]||0;return`<div class="card"><div class="row" style="margin:0 0 8px;justify-content:space-between"><h2 style="margin:0">${t}</h2><button class="s${v}" data-skill="${id}">${T.sk[v]}</button></div><div class="skill">${gfx(id)}<div><p class="mute" style="margin-top:0">${goal}</p><ul>${how.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>${drill}</b></p></div></div></div>`}).join('')+
 `<div class="card"><h2>${T.fixH}</h2><table><thead><tr>${T.fixTh.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${T.fixes.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</tbody></table></div>
 <div class="card"><h2>${T.testH}</h2><p class="mute">${T.testIntro}</p>${T.tests.map((t,i)=>`<label class="ex"><input type="checkbox" data-test="t${i}" ${P.skill['t'+i]?'checked':''}><span>${t}</span></label>`).join('')}</div>`}

// Interactive piste map around the preset profile's residence. Pistes and lifts come from pistes.js (see tools/build_pistes.py).
const BASE=[45.257285,6.264863],PCOL={green:'#2e9e4f',blue:'#1f6feb',red:'#e2283f',black:'#12212f'};
let mapObj=null,pisteLayers=[];
const hasPistes=()=>typeof PISTES!=='undefined';
const km=m=>m>=1000?(m/1000).toFixed(1)+' km':m+' m';
const dBase=p=>Math.min(...p.g.flat().map(q=>Math.hypot((q[0]-BASE[0])*111320,(q[1]-BASE[1])*78400)));
// Gradient is only trusted where the numbers are consistent (same-named pistes in two villages get merged in the data).
const sane=p=>p.n&&p.avg!=null&&p.avg<=p.max+3;
// Recommendation groups, in the order of T.map.groups, for a rider comfortable on blues and working toward reds.
function recs(){if(!hasPistes())return[];const ok=PISTES.map((p,i)=>({...p,i})).filter(p=>sane(p)&&dBase(p)<1500),by=k=>(a,b)=>a[k]-b[k];
 return[ok.filter(p=>p.c==='blue'&&p.avg>=9&&p.avg<=16&&p.len>=800).sort(by('avg')),
  ok.filter(p=>p.c==='blue'&&p.avg>=18&&p.len>=500).sort(by('avg')),
  ok.filter(p=>p.c==='red'&&p.len>=700&&p.max<=37&&p.avg<=24).sort((a,b)=>a.max-b.max||a.avg-b.avg).slice(0,4),
  ok.filter(p=>p.c==='red'&&p.max>=42).sort(by('max')),
  ok.filter(p=>p.c!=='red'&&p.c!=='black'&&p.avg<=8&&p.len>=800)]}
const pisteFacts=p=>`${km(p.len)}${sane(p)?` · ${p.top} → ${p.bot} m · ${T.map.avg} ${p.avg}% · ${T.map.steep} ${p.max}%`:''}`;
function mapCard(){const m=T.map,url='https://www.sybelles.ski/en/',r=recs();
 return`<div class="card"><h2>${m.h}</h2><p>${m.intro}</p><div id="map"></div><p class="mute">${m.legend.map((l,i)=>`<span class="dot" style="background:${Object.values(PCOL)[i]}"></span>${l}`).join('')}</p><ul>${m.near.map(n=>`<li>${n}</li>`).join('')}</ul><p>${m.links} <a href="${url}live/slopes-map" target="_blank" rel="noopener">${m.official}</a> · <a href="${url}discover/map-of-the-slopes/" target="_blank" rel="noopener">${m.download}</a></p></div>`+
 (r.length?`<div class="card"><h2>${m.recH}</h2><p class="mute">${m.recIntro}</p>${r.map((list,i)=>list.length?`<h3>${m.groups[i][0]}</h3><p class="mute">${m.groups[i][1]}</p>${list.map(p=>`<button class="piste" data-piste="${p.i}"><span class="dot" style="background:${PCOL[p.c]}"></span><b>${p.n}</b> <small>${pisteFacts(p)}</small></button>`).join('')}`:'').join('')}<p class="mute" style="margin-top:12px">${m.caveat}</p></div>`:'')}
function showMap(){if(!el('map'))return;
 if(!window.L){el('map').outerHTML=`<p class="mute">${T.map.off}</p>`;return}
 const m=T.map,osm='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
 mapObj=L.map('map',{scrollWheelZoom:false,preferCanvas:true}).setView(BASE,14);   // canvas: the page's own svg styles would break Leaflet's svg layers
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:osm}).addTo(mapObj);
 const snow=L.tileLayer('https://tiles.opensnowmap.org/pistes/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.opensnowmap.org">OpenSnowMap</a>'}),
  vec=L.layerGroup().addTo(mapObj),label=(n,rec)=>({permanent:true,direction:'center',className:'plabel'+(rec?' rec':'')});
 pisteLayers=[];
 if(hasPistes()){const rec=new Set(recs().slice(0,3).flat().map(p=>p.i));
  LIFTS.forEach(l=>{const ln=L.polyline(l.g,{color:'#12212f',weight:2,dashArray:'7 5'}).addTo(vec).bindPopup(`<b>${l.n||m.lift[l.k]}</b><br>${m.lift[l.k]}`);if(l.n)ln.bindTooltip(l.n,label(l.n))});
  PISTES.forEach((p,i)=>{const ln=L.polyline(p.g,{color:PCOL[p.c],weight:rec.has(i)?7:p.n?4:2,opacity:.9}).addTo(vec);pisteLayers[i]=ln;
   if(p.n)ln.bindPopup(`<b>${p.n}</b><br>${m.col[p.c]} · ${pisteFacts(p).replace(/ · /g,'<br>')}`).bindTooltip(p.n,label(p.n,rec.has(i)))})}
 else snow.addTo(mapObj);
 L.control.layers(null,{[m.layers[0]]:vec,[m.layers[1]]:snow}).addTo(mapObj);
 mapObj.on('zoomend',()=>el('map').classList.toggle('zoomed',mapObj.getZoom()>=15));
 L.marker(BASE,{icon:L.divIcon({className:'base',html:'⌂',iconSize:[30,30]})}).addTo(mapObj).bindPopup(m.base)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-piste]'),ln=b&&pisteLayers[b.dataset.piste];if(!ln||!mapObj)return;
 el('map').scrollIntoView({behavior:'smooth',block:'center'});mapObj.fitBounds(ln.getBounds(),{maxZoom:15,padding:[30,30]});ln.openPopup()});

function vTrip(){return`<div class="card">${T.tripIntro(fmt(P.trip))}</div>`+(P.preset?mapCard():'')+
 T.trip.map((t,i)=>`<div class="card"><span class="tag">${T.dayN} ${i+1} · ${fmt(add(P.trip,i))}</span> <span class="tag">${P.preset?t[1]:T.yourBoard}</span><h2 style="margin-top:8px">${t[0]}</h2><p>${t[2]}</p></div>`).join('')+`<div class="card">${T.mornings}</div>`}

function vProfile(){const ids=Object.keys(S.profiles),f=T.pf,
 stance=(attr,v)=>`<select ${attr}>${['goofy','regular'].map(s=>`<option value="${s}" ${s===v?'selected':''}>${f[s]}</option>`).join('')}</select>`,
 fields=(inp,sel)=>`<div class="form"><label>${f.name}${inp('name','text','maxlength="30"')}</label><label>${f.cm}${inp('cm','number','min="120" max="230"')}</label><label>${f.kg}${inp('kg','number','min="30" max="200"')}</label><label>${f.stance}${sel}</label><label>${f.resort}${inp('resort','text','maxlength="40"')}</label></div>`;
 return`<div class="card"><h2>${f.profiles}</h2><div class="row">${ids.map(id=>`<button class="${id===S.active?'pri':''}" data-profile="${id}">${esc(S.profiles[id].name)}</button>`).join('')}</div></div>
 <div class="card"><h2>${esc(P.name)}</h2>${fields((k,t,x)=>`<input data-pf="${k}" type="${t}" value="${esc(P[k])}" ${x}>`,stance('data-pf="stance"',P.stance))}<p class="mute">${f.note}</p>${ids.length>1?`<div class="row"><button data-delprofile>${f.del}</button></div>`:''}</div>
 <div class="card"><h2>${f.add}</h2>${fields((k,t,x)=>`<input id="np-${k}" type="${t}" ${x}>`,stance('id="np-stance"','regular'))}<div class="row"><button class="pri" data-newprofile>${f.create}</button></div></div>`}

const VIEWS={today:vToday,plan:vPlan,stance:vStance,tech:vTech,trip:vTrip,profile:vProfile};
function render(){document.documentElement.lang=S.lang;
 el('head').innerHTML=`<div><h1>${T.title}</h1></div><div class="row" style="margin:0;flex-wrap:nowrap"><button data-tab="profile">${esc(P.name)}</button><button data-lang>${T.other}</button></div>`;
 el('nav').innerHTML=Object.entries(T.tabs).map(([k,v])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${v}</button>`).join('');
 if(mapObj){mapObj.remove();mapObj=null}
 el('app').innerHTML=fill(VIEWS[tab]());showMap();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('svg').forEach(s=>s.pauseAnimations())}

const okStat=(k,n)=>k==='cm'?n>=120&&n<=230:n>=30&&n<=200;
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-open],[data-done],[data-fb],[data-skill],[data-lang],[data-profile],[data-delprofile],[data-newprofile]');if(!t)return;const a=t.dataset;
 if('lang' in a){S.lang=S.lang==='en'?'nl':'en';T=C[S.lang]}
 else if(a.profile){use(a.profile);sel=TODAY}
 else if('delprofile' in a){if(!confirm(T.pf.delConfirm(P.name)))return;delete S.profiles[S.active];use();sel=TODAY}
 else if('newprofile' in a){const v=k=>el('np-'+k).value.trim(),cm=+v('cm'),kg=+v('kg');
  if(!v('name')||!okStat('cm',cm)||!okStat('kg',kg)){alert(T.pf.invalid);return}
  const id='p'+Date.now();S.profiles[id]={name:v('name'),cm,kg,stance:v('stance'),resort:v('resort')||T.pf.mountains,start:null,trip:add(TODAY,84),chk:{},done:{},fb:{},skill:{}};use(id);sel=TODAY}
 else if(a.tab){tab=a.tab;scrollTo(0,0)}
 else if(a.open){sel=a.open;tab='today'}
 else if(a.done){if(P.done[a.done]){delete P.done[a.done];delete P.fb[a.done]}else P.done[a.done]=1}
 else if(a.fb){const[d,v]=a.fb.split('|');P.fb[d]=+v}
 else if(a.skill)P.skill[a.skill]=((P.skill[a.skill]||0)+1)%3;
 save();render()});
document.addEventListener('change',e=>{const a=e.target.dataset;
 if(a.chk){const[d,i]=a.chk.split('|'),set=new Set(P.chk[d]||[]);e.target.checked?set.add(+i):set.delete(+i);P.chk[d]=[...set];save()}
 else if(a.test){P.skill[a.test]=e.target.checked?1:0;save();render()}
 else if(e.target.id==='trip'&&e.target.value>P.start){P.trip=e.target.value;save();render()}
 else if(a.pf){const k=a.pf,v=e.target.value.trim(),num=k==='cm'||k==='kg';   // invalid edits are dropped and the form re-renders with the old value
  if(num?okStat(k,+v):v)P[k]=num?+v:v;save();render()}});
el('flakes').innerHTML=Array.from({length:28},(_,i)=>{const x=(i*43+17)%1200,r=1+i%3,dur=9+i%7;return`<circle cx="${x}" r="${r}" opacity=".8"><animate attributeName="cy" dur="${dur}s" begin="-${i*.9}s" repeatCount="indefinite" values="-10;310"/><animate attributeName="cx" dur="${dur}s" begin="-${i*.9}s" repeatCount="indefinite" values="${x};${x+30};${x}"/></circle>`}).join('');
render();
</script>
</body>
</html>
